<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Grading System</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#eef2f7;
display:flex;
justify-content:center;
padding:40px;
}

.container{
background:#fff;
padding:30px;
border-radius:10px;
width:420px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
width:100%;
padding:10px;
margin:10px 0;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#28a745;
color:white;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#218838;
}

#result{
margin-top:20px;
padding:15px;
background:#f8f9fa;
border-radius:8px;
}

</style>

<script src="grading.js" defer></script>

</head>

<body>

<div class="container">

<h2>Student Grading System</h2>

<p>
<strong>Student:</strong> Pramit Kumar Ghosh<br>
<strong>PRN:</strong> 24070521109
</p>

<label>Enter Marks (0–100)</label>

<input
type="number"
id="marks"
placeholder="Enter marks">

<button onclick="calculateGrade()">

Calculate Grade

</button>

<div id="result">

Enter marks and click "Calculate Grade".

</div>

</div>

</body>

</html>
