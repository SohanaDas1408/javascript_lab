<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart Calculator</title>

<style>

body{

font-family:Arial,Helvetica,sans-serif;
background:#eef2f7;
display:flex;
justify-content:center;
padding:40px;

}

.container{

background:white;
padding:30px;
width:650px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);

}

select,input{

width:100%;
padding:10px;
margin:10px 0;
font-size:16px;

}

button{

width:100%;
padding:12px;
margin-top:10px;
font-size:16px;
background:#007bff;
color:white;
border:none;
cursor:pointer;

}

button:hover{

background:#0056b3;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

table,th,td{

border:1px solid #ccc;

}

th,td{

padding:10px;
text-align:center;

}

#bill{

margin-top:20px;
background:#f8f9fa;
padding:15px;
border-radius:8px;

}

</style>

<script src="cart.js" defer></script>

</head>

<body>

<div class="container">

<h2>Shopping Cart Calculator</h2>

<p>

<strong>Student:</strong> Pramit Kumar Ghosh

<br>

<strong>PRN:</strong> 24070521109

</p>

<label>Select Product</label>

<select id="product">

<option value="Laptop">Laptop - ₹55,000</option>

<option value="Mouse">Mouse - ₹800</option>

<option value="Keyboard">Keyboard - ₹1,500</option>

<option value="Headphones">Headphones - ₹2,000</option>

<option value="Pendrive">Pendrive - ₹700</option>

</select>

<label>Quantity</label>

<input
type="number"
id="quantity"
placeholder="Enter quantity">

<button onclick="addToCart()">

Add To Cart

</button>

<h3>Shopping Cart</h3>

<table>

<tr>

<th>No.</th>
<th>Product</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>

</tr>

<tbody id="cartItems">

</tbody>

</table>

<button onclick="calculateBill()">

Calculate Bill

</button>

<div id="bill">

Bill will appear here.

</div>

</div>

</body>

</html>
