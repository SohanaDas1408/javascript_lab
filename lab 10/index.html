<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JSON Data Loader</title>

    <!-- jQuery CDN -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- External JavaScript -->

    <script src="script.js" defer></script>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;

        background-color: #eef2f7;

        margin: 0;

        padding: 40px;
      }

      .container {
        max-width: 950px;

        margin: auto;

        background-color: white;

        padding: 30px;

        border-radius: 12px;

        box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      }

      h1 {
        text-align: center;

        margin-bottom: 10px;
      }

      .student-info {
        background-color: #f5f5f5;

        padding: 12px;

        border-radius: 6px;

        margin-bottom: 25px;
      }

      .section {
        margin-top: 30px;
      }

      .section h2 {
        margin-bottom: 8px;
      }

      button {
        padding: 11px 18px;

        border: none;

        border-radius: 6px;

        background-color: #007bff;

        color: white;

        font-size: 15px;

        cursor: pointer;

        margin-bottom: 15px;
      }

      button:hover {
        background-color: #0056b3;
      }

      .jquery-button {
        background-color: #28a745;
      }

      .jquery-button:hover {
        background-color: #1e7e34;
      }

      table {
        width: 100%;

        border-collapse: collapse;

        margin-top: 10px;
      }

      th,
      td {
        border: 1px solid #ddd;

        padding: 12px;

        text-align: left;
      }

      th {
        background-color: #343a40;

        color: white;
      }

      tr:nth-child(even) {
        background-color: #f8f9fa;
      }

      .status {
        margin: 10px 0;

        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>JSON Student Data</h1>

      <div class="student-info">
        <strong>Student:</strong>
        Pramit Kumar Ghosh

        <br />

        <strong>PRN:</strong>
        24070521109
      </div>

      <!-- =====================================
         FETCH API SECTION
         ===================================== -->

      <div class="section">
        <h2>1. Using Fetch API</h2>

        <p>
          Load JSON data using JavaScript
          <code>fetch()</code>.
        </p>

        <button onclick="loadUsingFetch()">Load Data using fetch()</button>

        <div id="fetchStatus" class="status"></div>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Name</th>

              <th>Course</th>

              <th>Semester</th>

              <th>Marks</th>
            </tr>
          </thead>

          <tbody id="fetchTableBody"></tbody>
        </table>
      </div>

      <!-- =====================================
         JQUERY SECTION
         ===================================== -->

      <div class="section">
        <h2>2. Using jQuery $.getJSON()</h2>

        <p>Load JSON data using jQuery <code>$.getJSON()</code>.</p>

        <button class="jquery-button" onclick="loadUsingJQuery()">
          Load Data using $.getJSON()
        </button>

        <div id="jqueryStatus" class="status"></div>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Name</th>

              <th>Course</th>

              <th>Semester</th>

              <th>Marks</th>
            </tr>
          </thead>

          <tbody id="jqueryTableBody"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
