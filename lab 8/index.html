<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gym Admission Form</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;

        background: #eef2f7;

        display: flex;

        justify-content: center;

        padding: 40px;
      }

      .container {
        width: 600px;

        background: white;

        padding: 30px;

        border-radius: 12px;

        box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;

        margin-bottom: 25px;
      }

      .student-info {
        background: #f5f5f5;

        padding: 12px;

        border-radius: 6px;

        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;

        margin-bottom: 6px;

        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;

        box-sizing: border-box;

        padding: 11px;

        font-size: 15px;

        border: 1px solid #ccc;

        border-radius: 6px;
      }

      textarea {
        resize: vertical;

        min-height: 80px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;

        border-color: #007bff;
      }

      .error {
        display: block;

        color: #dc3545;

        font-size: 13px;

        margin-top: 5px;
      }

      .success {
        display: block;

        color: #28a745;

        font-size: 13px;

        margin-top: 5px;
      }

      button {
        width: 100%;

        padding: 13px;

        background: #007bff;

        color: white;

        border: none;

        border-radius: 6px;

        font-size: 16px;

        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      #successMessage {
        margin-top: 20px;

        padding: 15px;

        background: #e9f7ef;

        border-radius: 8px;

        color: #155724;
      }
    </style>

    <script src="gym.js" defer></script>
  </head>

  <body>
    <div class="container">
      <h2>Gym Admission Form</h2>

      <div class="student-info">
        <strong>Student:</strong>
        Pramit Kumar Ghosh

        <br />

        <strong>PRN:</strong>
        24070521109
      </div>

      <form id="gymForm">
        <!-- Name -->

        <div class="form-group">
          <label for="name"> Full Name </label>

          <input type="text" id="name" placeholder="Enter your full name" />

          <span id="nameError" class="error"> </span>
        </div>

        <!-- Email -->

        <div class="form-group">
          <label for="email"> Email Address </label>

          <input type="email" id="email" placeholder="example@email.com" />

          <span id="emailError" class="error"> </span>
        </div>

        <!-- Phone -->

        <div class="form-group">
          <label for="phone"> Phone Number </label>

          <input
            type="text"
            id="phone"
            maxlength="10"
            placeholder="Enter 10-digit phone number"
          />

          <span id="phoneError" class="error"> </span>
        </div>

        <!-- Age -->

        <div class="form-group">
          <label for="age"> Age </label>

          <input
            type="number"
            id="age"
            min="16"
            max="80"
            placeholder="Enter your age"
          />

          <span id="ageError" class="error"> </span>
        </div>

        <!-- Gender -->

        <div class="form-group">
          <label for="gender"> Gender </label>

          <select id="gender">
            <option value="">Select Gender</option>

            <option value="Male">Male</option>

            <option value="Female">Female</option>

            <option value="Other">Other</option>
          </select>

          <span id="genderError" class="error"> </span>
        </div>

        <!-- Membership -->

        <div class="form-group">
          <label for="plan"> Membership Plan </label>

          <select id="plan">
            <option value="">Select Membership</option>

            <option value="Monthly">Monthly - ₹1,500</option>

            <option value="Quarterly">Quarterly - ₹4,000</option>

            <option value="Yearly">Yearly - ₹12,000</option>
          </select>

          <span id="planError" class="error"> </span>
        </div>

        <!-- Fitness Goal -->

        <div class="form-group">
          <label for="goal"> Fitness Goal </label>

          <textarea
            id="goal"
            placeholder="Example: Weight loss, muscle building, fitness..."
          >
          </textarea>

          <span id="goalError" class="error"> </span>
        </div>

        <!-- Submit -->

        <button type="submit">Submit Admission Form</button>
      </form>

      <div id="successMessage"></div>
    </div>
  </body>
</html>
